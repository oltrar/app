name: LoopMate
options:
  bundleIdPrefix: dev.loopmate
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LoopMate:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: LoopMate
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loopmate.ios
        GENERATE_INFOPLIST_FILE: "NO"
schemes:
  LoopMate:
    build:
      targets:
        LoopMate: all
