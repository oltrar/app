name: LoopMate
options:
  bundleIdPrefix: dev.loopmate
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LoopMate:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: LoopMate
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loopmate.ios
        GENERATE_INFOPLIST_FILE: "NO"
  LoopMateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - presets.json
      - path: Tests/presets.json
        buildPhase: resources
    dependencies:
      - target: LoopMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loopmate.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  LoopMate:
    build:
      targets:
        LoopMate: all
        LoopMateUITests: [test]
    test:
      targets:
        - LoopMateUITests
